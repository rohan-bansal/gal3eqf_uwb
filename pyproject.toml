[project]
name = "gal3uwb"
version = "0.1.0"
description = "Galilean equivariant filtering for listen-only UWB + IMU localization"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gtsam==4.3.0",
    "numpy",
    "scipy",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gal3uwb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
